[project]
name = "oparl-council-harvester"
version = "0.1.0"
description = "OParl council harvester for Frankfurt/Rhine-Main (IRIS-SIG-20)"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "tenacity>=8.2",
    "pydantic>=2.6",
    "psycopg[binary]>=3.1",
    "pyproj>=3.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "respx>=0.21", "requests>=2.31"]  # requests: only for scripts/exploration

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
